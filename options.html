<!-- options.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT Link Generator - Options</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        max-width: 560px;
      }

      h1 {
        font-size: 1.4rem;
      }

      label {
        align-items: center;
        display: flex;
        font-weight: 600;
        gap: 8px;
      }

      .documentation {
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 20px;
      }

      .field-group {
        margin-bottom: 16px;
      }

      code {
        display: block;
        margin-top: 8px;
        overflow-wrap: anywhere;
      }

      #status {
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <h1>ChatGPT Link Generator - Preferences</h1>

    <div class="documentation">
      <h2>Output format</h2>
      <p>
        Icon Link copies a self-contained HTML snippet with an inline SVG icon:
        <code>
          &lt;a href="[crafted-url]" aria-label="Open in ChatGPT"&gt;
            &lt;svg ...&gt;&lt;/svg&gt;
          &lt;/a&gt;
        </code>
        When disabled, the extension copies only the plain ChatGPT URL.
      </p>
    </div>

    <div class="field-group">
      <label>
        <input id="useIconSnippetCheckbox" type="checkbox" />
        Copy as an icon link
      </label>
    </div>

    <button id="saveBtn">Save Preferences</button>
    <span id="status" role="status" aria-live="polite"></span>

    <script src="options.js"></script>
  </body>
</html>
